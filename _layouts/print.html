<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <style>
      @page {
        margin: 0.4in;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
        color: #000000;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 11pt;
        line-height: 1.35;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      main {
        max-width: 7.5in;
        margin: 0 auto;
        padding: 0.25in 0;
      }

      h1 {
        font-size: 16pt;
        margin: 0 0 0.25rem;
      }

      h2 {
        font-size: 12pt;
        margin: 0.85rem 0 0.35rem;
      }

      h3 {
        font-size: 11pt;
        margin: 0.55rem 0 0.2rem;
      }

      p,
      ul {
        margin: 0 0 0.35rem;
      }

      li {
        margin-bottom: 0.15rem;
      }

      hr {
        border: 0;
        border-top: 1px solid #cccccc;
        margin: 0.45rem 0;
      }

      a,
      a:visited {
        color: #0000ee;
        text-decoration: underline;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10pt;
        margin-bottom: 0.5rem;
      }

      th,
      td {
        border: 1px solid #999999;
        padding: 0.2rem 0.35rem;
        text-align: left;
        vertical-align: top;
      }

      @media print {
        main {
          padding: 0;
        }

        body {
          font-size: 9.5pt;
          line-height: 1.22;
        }

        h1 {
          font-size: 14pt;
        }

        h2 {
          font-size: 10.5pt;
          margin-top: 0.55rem;
        }

        h3 {
          font-size: 9.8pt;
          margin-top: 0.35rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      {{ content }}
    </main>
  </body>
</html>
